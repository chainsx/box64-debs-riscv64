name: Build Box64 RV64 deb repository

on:
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: 'Build even when upstream commit.txt has not changed'
        required: false
        default: false
        type: boolean
      box64_branch:
        description: 'Box64 branch or tag to build'
        required: false
        default: 'main'
        type: string

permissions:
  contents: write

concurrency:
  group: box64-rv64-deb-repository
  cancel-in-progress: false

jobs:
  build-box64-rv64:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install cross build dependencies
        run: sudo ./scripts/install-build-deps.sh

      - name: Build riscv64 package by cross compilation
        env:
          BOX64_BRANCH: ${{ inputs.box64_branch }}
          FORCE_REBUILD: ${{ inputs.force_rebuild }}
          PKG_MAINTAINER: ${{ vars.PKG_MAINTAINER || 'Box64 RV64 Maintainer <noreply@example.com>' }}
        run: ./scripts/build-box64-rv64.sh

      - name: Import GPG key
        if: ${{ hashFiles('exited_successfully.txt') == '' && secrets.GPG_PRIVATE_KEY != '' }}
        uses: crazy-max/ghaction-import-gpg@v6
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}

      - name: Rebuild and sign APT repository metadata
        if: ${{ hashFiles('exited_successfully.txt') == '' }}
        env:
          GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: ./scripts/update-apt-repo.sh

      - name: Commit repository update
        run: |
          if [[ -f exited_successfully.txt ]]; then
            rm -f exited_successfully.txt
            echo "No upstream Box64 change; nothing to commit."
            exit 0
          fi

          git config user.email "${{ vars.GIT_COMMIT_EMAIL || 'github-actions[bot]@users.noreply.github.com' }}"
          git config user.name "${{ vars.GIT_COMMIT_NAME || 'github-actions[bot]' }}"

          git add .
          git commit -m "Update box64 rv64 to commit $(cat commit.txt)" || exit 0
          git push
